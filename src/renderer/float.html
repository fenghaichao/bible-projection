<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>浮动控制面板</title>
<link rel="stylesheet" href="float.css" />
</head>
<body class="float-body">

  <div class="float-card" id="float-card">
    <nav class="float-tabs" id="float-tabs">
      <button class="float-tab is-active" type="button" data-tab="verse">经文选择</button>
      <button class="float-tab" type="button" data-tab="search">查找</button>
      <button class="float-tab" type="button" data-tab="format">格式</button>
      <button class="float-tab" type="button" data-tab="nt">新约</button>
      <button class="float-tab" type="button" data-tab="ot">旧约</button>
    </nav>

    <section class="float-page is-active" data-page="verse">
      <p class="float-ref" id="float-ref">—</p>
      <p class="float-text" id="float-text"></p>
      <div class="float-actions">
        <button class="float-btn" type="button" id="float-prev">上一节</button>
        <button class="float-btn" type="button" id="float-next">下一节</button>
      </div>
    </section>

    <section class="float-page" data-page="search">
      <input class="float-input" id="float-search" type="text" placeholder="关键字（空格分隔）" autocomplete="off" />
      <div class="float-actions">
        <button class="float-btn" type="button" id="float-search-go">在主窗口查找</button>
      </div>
    </section>

    <section class="float-page" data-page="format">
      <div class="float-actions">
        <button class="float-btn" type="button" id="float-font-down">字号 −</button>
        <span class="float-value" id="float-font">48</span>
        <button class="float-btn" type="button" id="float-font-up">字号 +</button>
      </div>
      <div class="float-actions">
        <button class="float-btn" type="button" id="float-theme">切换主题</button>
      </div>
    </section>

    <section class="float-page" data-page="nt">
      <ul class="float-list" id="float-nt-list"></ul>
    </section>

    <section class="float-page" data-page="ot">
      <ul class="float-list" id="float-ot-list"></ul>
    </section>

    <div class="float-foot">
      <button class="float-btn float-btn-accent" type="button" id="float-exit">退出投影</button>
      <button class="float-btn" type="button" id="float-close">关闭</button>
    </div>
  </div>

  <script type="module" src="js/float.js"></script>
</body>
</html>
